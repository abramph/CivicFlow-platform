name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CivicFlow ${{ github.ref_name }}" \
            --notes "CivicFlow Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Probe Artifact Signing API (raw HTTP)
        continue-on-error: true
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Write-Host "Tenant ID  : 6da094ae-ae57-4674-b36e-645fa45e1c4a"
          Write-Host "Sub ID     : bdb68447-595d-41e5-b478-aa177b385dbf"
          Write-Host "Client ID  : 2ccf8c43-83d3-44e2-a6f6-124e81b84183"
          Write-Host "Account    : civicflow-signing"
          Write-Host "Profile    : CivicFlow"
          Write-Host "Endpoint   : https://eus.codesigning.azure.net/"

          $body = "client_id=$env:AZURE_CLIENT_ID&client_secret=$env:AZURE_CLIENT_SECRET" +
                  "&scope=https://codesigning.azure.net/.default&grant_type=client_credentials"
          $token = (Invoke-RestMethod -Method POST `
            -Uri "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token" `
            -Body $body -ContentType "application/x-www-form-urlencoded").access_token

          $correlationId = [Guid]::NewGuid().ToString()
          $headers = @{
            Authorization       = "Bearer $token"
            "x-ms-client-request-id" = $correlationId
          }
          Write-Host "Correlation ID sent: $correlationId"

          try {
            $r = Invoke-WebRequest -Method GET `
              -Uri "https://eus.codesigning.azure.net/codesigning/api/civicflow-signing/certificateProfiles/CivicFlow?api-version=2024-09-30-preview" `
              -Headers $headers -UseBasicParsing -ErrorAction Stop
            Write-Host "Response: $($r.StatusCode)"
            Write-Host "Body: $($r.Content)"
          } catch {
            $resp = $_.Exception.Response
            $statusCode = [int]$resp.StatusCode
            Write-Host "Response status: $statusCode"
            $rqId = $resp.Headers["x-ms-request-id"]
            $corrId = $resp.Headers["x-correlation-id"]
            Write-Host "x-ms-request-id   : $rqId"
            Write-Host "x-correlation-id  : $corrId"
            try {
              $reader = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $respBody = $reader.ReadToEnd()
              Write-Host "Response body: $respBody"
            } catch { Write-Host "Response body: (empty)" }
          }

      - name: Sign with Artifact Signing
        id: signing
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.0
        env:
          AZURE_LOG_LEVEL: verbose
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          trace: true

      - name: Warn if Artifact Signing failed
        if: steps.signing.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Artifact Signing failed — installer will be uploaded UNSIGNED. Account: civicflow-signing, Profile: CivicFlow, Endpoint: https://eus.codesigning.azure.net/"

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Uploading assets to release ${TAG}"
          for f in release/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest.yml ] && gh release upload "$TAG" release/latest.yml --clobber || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn
