name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Unestra ${{ github.ref_name }}" \
            --notes "Unestra Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Sign with Artifact Signing
        id: signing
        continue-on-error: true
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn if Artifact Signing failed
        if: steps.signing.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Artifact Signing failed — installer will be uploaded UNSIGNED. Account: civicflow-signing, Profile: CivicFlow, Endpoint: https://eus.codesigning.azure.net/"

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Uploading assets to release ${TAG}"
          for f in release/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest.yml ] && gh release upload "$TAG" release/latest.yml --clobber || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn

  build-mac:
    runs-on: macos-latest
    # Depends on build-windows creating the GitHub release first — without
    # this, the two jobs run in parallel and this job's "gh release upload"
    # can race ahead of the release even existing (observed on the v1.0.9
    # release: build-mac finished first and failed with "release not found").
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer certificate
        continue-on-error: true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — skipping keychain import"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          npm run build:app
          # Only force-disable identity auto-discovery when no certificate was
          # imported into the keychain — otherwise let electron-builder find
          # and use it, so the DMG actually gets signed (and then notarized).
          # Signing unconditionally off here is why past DMGs shipped
          # completely unsigned and macOS Gatekeeper reported them as damaged.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple Developer certificate configured (APPLE_CERTIFICATE secret) — building an UNSIGNED, unnotarized DMG. macOS Gatekeeper will refuse to open this on other machines (\"is damaged and can't be opened\"). See project memory / windows_signing.md-style docs for the Apple equivalent of the Azure signing setup."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg --publish never

      - name: Publish DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for f in release/*.dmg; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest-mac.yml ] && gh release upload "$TAG" release/latest-mac.yml --clobber || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-mac
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: warn
