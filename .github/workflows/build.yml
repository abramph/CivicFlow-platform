name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CivicFlow ${{ github.ref_name }}" \
            --notes "CivicFlow Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: civicflow-signing
          certificate-profile-name: CivicFlow
          files-folder: release
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Uploading assets to release ${TAG}"
          for f in release/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest.yml ] && gh release upload "$TAG" release/latest.yml --clobber || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn
