name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CivicFlow ${{ github.ref_name }}" \
            --notes "CivicFlow Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Sign with Azure Trusted Signing
        id: signing
        continue-on-error: true
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber
          Import-Module TrustedSigning
          Invoke-TrustedSigning `
            -Endpoint "https://eus.codesigning.azure.net/" `
            -CodeSigningAccountName "civicflow-signing" `
            -CertificateProfileName "CivicFlow" `
            -FilesFolder "${{ github.workspace }}\release" `
            -FilesFolderFilter "exe" `
            -TimestampRfc3161 "http://timestamp.acs.microsoft.com" `
            -TimestampDigest SHA256 `
            -FileDigest SHA256

      - name: Warn if signing failed
        if: steps.signing.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Azure Trusted Signing failed — installer will be uploaded UNSIGNED. Check the Azure portal for signing account status."

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Uploading assets to release ${TAG}"
          for f in release/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest.yml ] && gh release upload "$TAG" release/latest.yml --clobber || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn
