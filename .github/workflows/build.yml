name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Unestra ${{ github.ref_name }}" \
            --notes "Unestra Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Sign with Artifact Signing
        id: signing
        continue-on-error: true
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn if Artifact Signing failed
        if: steps.signing.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Artifact Signing failed — installer will be uploaded UNSIGNED. Account: civicflow-signing, Profile: CivicFlow, Endpoint: https://eus.codesigning.azure.net/"

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Uploading assets to release ${TAG}"
          for f in release/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest.yml ] && gh release upload "$TAG" release/latest.yml --clobber || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn

  build-mac:
    runs-on: macos-latest
    # Depends on build-windows creating the GitHub release first — without
    # this, the two jobs run in parallel and this job's "gh release upload"
    # can race ahead of the release even existing (observed on the v1.0.9
    # release: build-mac finished first and failed with "release not found").
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer certificate
        continue-on-error: true
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "No Apple certificate configured — skipping keychain import"
            exit 0
          fi
          set -eo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          # A random per-run keychain password (MACOS_KEYCHAIN_PASSWORD),
          # not an empty string — the previous version of this step used
          # `-p ""`, which leaves the temporary signing keychain effectively
          # unprotected for the duration of the job.
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Decode notarization API key
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY_BASE64" ]; then
            echo "No API-key notarization credential configured — notarization will be skipped."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          npm run build:app
          # Only force-disable identity auto-discovery when no certificate was
          # imported into the keychain — otherwise let electron-builder find
          # and use it, so the DMG actually gets signed (and then notarized).
          # Signing unconditionally off here is why past DMGs shipped
          # completely unsigned and macOS Gatekeeper reported them as damaged.
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning::No Apple Developer certificate configured (MACOS_CERTIFICATE_BASE64 secret) — building an UNSIGNED, unnotarized DMG. macOS Gatekeeper will refuse to open this on other machines (\"is damaged and can't be opened\")."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          # electron-builder's own built-in notarization (runs during signing,
          # before scripts/notarize.js's afterSign hook) expects these exact
          # env var names, distinct from APPLE_API_KEY_ID/APPLE_API_ISSUER_ID
          # above. Confirmed via a real credentialed run of
          # macos-signing-notarization.yml: without this, the build fails
          # with "Env vars APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER
          # need to be set" before packaging even starts.
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_PRIVATE_KEY_PATH" ]; then
            export APPLE_API_KEY="$APPLE_API_PRIVATE_KEY_PATH"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ID"
          else
            echo "::warning::No API-key notarization credentials configured — notarization will be skipped."
          fi

          npx electron-builder --mac dmg zip --publish never

      - name: Verify code signature and notarization
        run: |
          APP_PATH=$(find release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::warning::No .app found to verify"
            exit 0
          fi
          echo "── codesign --verify --deep --strict ──"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH" || echo "::warning::codesign verify failed"
          echo "── identity ──"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority=Developer|Notarization" || true
          echo "── Gatekeeper assessment ──"
          spctl --assess --type execute --verbose=4 "$APP_PATH" || echo "::warning::Gatekeeper assessment failed"

      - name: Staple notarization ticket
        run: |
          APP_PATH=$(find release -maxdepth 2 -name "*.app" -print -quit)
          DMG_PATH=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -n "$APP_PATH" ]; then
            xcrun stapler validate "$APP_PATH" || echo "::warning::App staple validation failed"
          fi
          if [ -n "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH" || echo "::warning::DMG staple failed"
            xcrun stapler validate "$DMG_PATH" || echo "::warning::DMG staple validation failed"
          fi

      - name: Publish DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for f in release/*.dmg release/*.zip release/*.blockmap; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          [ -f release/latest-mac.yml ] && gh release upload "$TAG" release/latest-mac.yml --clobber || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: warn

      - name: Clean up temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer_id.p12" 2>/dev/null || true
