name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CivicFlow ${{ github.ref_name }}" \
            --notes "CivicFlow Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Build Windows installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --publish never

      - name: Sign with Azure Trusted Signing
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: civicflow-signing
          certificate-profile-name: CivicFlow
          files-folder: release
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in release/*.exe; do
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
          if [ -f release/latest.yml ]; then
            gh release upload "${{ github.ref_name }}" release/latest.yml --clobber
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16     assets/icons/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icons/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icons/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icons/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icons/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icons/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icons/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icons/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icons/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icons/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o assets/icons/icon.icns
          ls -la assets/icons/icon.icns

      - name: Create GitHub release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CivicFlow ${{ github.ref_name }}" \
            --notes "CivicFlow Desktop ${{ github.ref_name }}" \
            --draft || true

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build app
        run: npm run build:app

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder
        run: |
          npx electron-builder --mac dmg --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }} 2>&1 | tee build-mac.log
          echo "--- Build complete ---"
          ls -la release/ || echo "No release directory"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build-mac.log
          if-no-files-found: warn

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicflow-macos
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: warn
