name: macOS Signing, Notarization, and DMG Release Candidate

# Dedicated, isolated pipeline for the macOS Electron release path. Separate
# from the existing production `build.yml` (which builds Windows + an
# unsigned-if-no-cert macOS DMG and auto-publishes on a version tag) — this
# workflow never publishes a public release, only private workflow artifacts
# and, optionally, a draft GitHub Release. See docs/macos-dmg-release.md.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "forge.config.js"
      - "scripts/notarize.js"
      - "build/**"
      - "assets/icons/**"
      - "src/main.js"
      - "src/main/**"
      - "src/preload.js"
      - "src/shared/**"
      - ".github/workflows/macos-signing-notarization.yml"
  workflow_dispatch:
    inputs:
      run_notarization:
        description: "Attempt code signing + notarization (requires Apple secrets; otherwise this input is ignored and the build stays unsigned)"
        type: boolean
        default: true
      create_draft_release_candidate:
        description: "Attach the artifact to a draft GitHub Release (stays private/draft — never publicly published by this workflow)"
        type: boolean
        default: false
      architecture:
        description: "Target macOS architecture"
        type: choice
        options:
          - arm64
        default: arm64

permissions:
  contents: read

jobs:
  # ── Job 1 — unsigned packaging validation ──────────────────────────────
  # Runs on every PR that touches packaging-relevant files, and always as
  # part of a manual dispatch. Never touches Apple secrets, never signs,
  # never notarizes — proves the app still packages correctly.
  validate-unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: node --test test/*.test.cjs

      - name: Lint
        run: npm run lint

      - name: Build unsigned validation package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build:app
          npx electron-builder --mac dmg zip --publish never

      - name: Inspect packaging output
        run: |
          echo "── release/ contents ──"
          ls -la release/
          APP_PATH=$(find release -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find release/mac* -maxdepth 1 -name "*.app" -print -quit 2>/dev/null)
          fi
          echo "App path: ${APP_PATH:-not found}"
          if [ -n "$APP_PATH" ]; then
            echo "── Info.plist identity ──"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist" || true
          fi
          echo "── codesign status (expected: unsigned / ad-hoc, this job never imports a certificate) ──"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true

      - name: Upload unsigned validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: unestra-mac-unsigned-validation
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 14

  # ── Credential preflight ─────────────────────────────────────────────────
  # Reports which secrets are configured without ever printing their values.
  # Runs only on manual dispatch — a PR (possibly from a fork) never has
  # access to repository secrets in a way this workflow relies on anyway,
  # but this keeps the intent explicit and keeps Job 1 secret-free entirely.
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_cert: ${{ steps.check.outputs.has_cert }}
      has_api_key: ${{ steps.check.outputs.has_api_key }}
      has_legacy_apple_id: ${{ steps.check.outputs.has_legacy_apple_id }}
      can_sign: ${{ steps.check.outputs.can_sign }}
      can_notarize: ${{ steps.check.outputs.can_notarize }}
    steps:
      - name: Check required secrets are present (values never printed)
        id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          present() { [ -n "$1" ] && echo "configured" || echo "missing"; }

          team_id=$(present "$APPLE_TEAM_ID")
          cert=$(present "$MACOS_CERTIFICATE_BASE64")
          cert_pw=$(present "$MACOS_CERTIFICATE_PASSWORD")
          keychain_pw=$(present "$MACOS_KEYCHAIN_PASSWORD")
          api_key_id=$(present "$APPLE_API_KEY_ID")
          api_issuer=$(present "$APPLE_API_ISSUER_ID")
          api_key=$(present "$APPLE_API_PRIVATE_KEY_BASE64")
          apple_id=$(present "$APPLE_ID")
          app_pw=$(present "$APPLE_APP_SPECIFIC_PASSWORD")

          echo "APPLE_TEAM_ID: $team_id"
          echo "Developer ID certificate (MACOS_CERTIFICATE_BASE64): $cert"
          echo "Certificate password (MACOS_CERTIFICATE_PASSWORD): $cert_pw"
          echo "Temporary keychain password (MACOS_KEYCHAIN_PASSWORD): $keychain_pw"
          echo "Notarization API key ID (APPLE_API_KEY_ID): $api_key_id"
          echo "Notarization API issuer (APPLE_API_ISSUER_ID): $api_issuer"
          echo "Notarization API private key (APPLE_API_PRIVATE_KEY_BASE64): $api_key"
          echo "Apple ID (legacy fallback, APPLE_ID): $apple_id"
          echo "App-specific password (legacy fallback, APPLE_APP_SPECIFIC_PASSWORD): $app_pw"

          has_cert=false; [ "$cert" = "configured" ] && [ "$cert_pw" = "configured" ] && [ "$keychain_pw" = "configured" ] && [ "$team_id" = "configured" ] && has_cert=true
          has_api_key=false; [ "$api_key_id" = "configured" ] && [ "$api_issuer" = "configured" ] && [ "$api_key" = "configured" ] && has_api_key=true
          has_legacy=false; [ "$apple_id" = "configured" ] && [ "$app_pw" = "configured" ] && [ "$team_id" = "configured" ] && has_legacy=true

          echo "has_cert=$has_cert" >> "$GITHUB_OUTPUT"
          echo "has_api_key=$has_api_key" >> "$GITHUB_OUTPUT"
          echo "has_legacy_apple_id=$has_legacy" >> "$GITHUB_OUTPUT"
          echo "can_sign=$has_cert" >> "$GITHUB_OUTPUT"
          if [ "$has_api_key" = "true" ] || [ "$has_legacy" = "true" ]; then
            echo "can_notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_notarize=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$has_cert" != "true" ]; then
            echo "::warning::Developer ID Application certificate not fully configured — the release-candidate job will build an UNSIGNED artifact. See docs/apple-credentials-setup.md."
          fi
          if [ "$has_api_key" != "true" ] && [ "$has_legacy" != "true" ]; then
            echo "::warning::No notarization credentials configured (neither API-key nor Apple ID method) — notarization will be skipped. See docs/apple-credentials-setup.md."
          fi

  # ── Job 2 — signed, notarized release candidate ─────────────────────────
  # Manual dispatch only. Builds honestly: if the certificate is missing, it
  # produces (and clearly labels) an unsigned artifact rather than silently
  # pretending to be a release candidate.
  release-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: macos-latest
    permissions:
      contents: write # only this job creates a (draft) release; validate-unsigned/preflight stay read-only
    env:
      RUN_NOTARIZATION: ${{ inputs.run_notarization }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute release-candidate version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RC_VERSION="${PKG_VERSION}-rc.${{ github.run_number }}"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_version=$RC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $PKG_VERSION"
          echo "This run's release-candidate version (never written back to package.json): $RC_VERSION"

      - name: Create temporary keychain
        if: needs.preflight.outputs.has_cert == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make it the default/search keychain for this job WITHOUT touching
          # the runner's persistent login keychain.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "── Signing identity available in temporary keychain ──"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Decode notarization API key (if configured)
        if: needs.preflight.outputs.has_api_key == 'true' && inputs.run_notarization == true
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -eo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build (sign + notarize via afterSign hook)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ needs.preflight.outputs.has_api_key == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ needs.preflight.outputs.has_api_key == 'true' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_ID: ${{ needs.preflight.outputs.has_legacy_apple_id == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.preflight.outputs.has_legacy_apple_id == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          set -eo pipefail
          npm run build:app

          BUILD_ARGS=(--mac dmg zip --publish never "-c.extraMetadata.version=${{ steps.version.outputs.rc_version }}")

          if [ "${{ needs.preflight.outputs.has_cert }}" != "true" ]; then
            echo "::warning::No Developer ID certificate configured — building UNSIGNED. This is not a valid release candidate for distribution."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [ "$RUN_NOTARIZATION" != "true" ]; then
            echo "Notarization explicitly disabled for this run (run_notarization=false input)."
            unset APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_API_PRIVATE_KEY_PATH
          fi

          npx electron-builder "${BUILD_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/build-and-notarize.log"

      - name: Extract notarization result from build log
        if: always()
        run: |
          LOG="$RUNNER_TEMP/build-and-notarize.log"
          RESULT_FILE="notarization-result.txt"
          if [ -f "$LOG" ] && grep -qi "notariz" "$LOG"; then
            grep -iE "notariz|submission|^  id:|^  status:|^  message:" "$LOG" > "$RESULT_FILE" || true
          else
            echo "Notarization was not attempted this run (no credentials configured, or run_notarization=false)." > "$RESULT_FILE"
          fi
          cat "$RESULT_FILE"

      - name: Find build outputs
        id: outputs
        run: |
          APP_PATH=$(find release -maxdepth 1 -name "*.app" -print -quit)
          DMG_PATH=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH"
          echo "DMG: $DMG_PATH"

      - name: Verify code signature and Hardened Runtime
        if: needs.preflight.outputs.has_cert == 'true'
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          echo "── codesign --verify --deep --strict ──"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          echo "── codesign -dv (identity + Hardened Runtime flags) ──"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign-app.log
          echo "── Team ID check ──"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -i "TeamIdentifier" || echo "::error::No TeamIdentifier found in signature"

      - name: Enumerate and verify nested Mach-O binaries
        if: needs.preflight.outputs.has_cert == 'true'
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          echo "── Nested executable/dylib/node inventory ──" | tee nested-signing.log
          find "$APP_PATH" -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.node" \) | while read -r f; do
            kind=$(file -b "$f")
            case "$kind" in
              *Mach-O*)
                echo "-- $f ($kind)" | tee -a nested-signing.log
                codesign -dv --verbose=4 "$f" 2>&1 | tee -a nested-signing.log
                ;;
            esac
          done

      - name: Gatekeeper assessment
        if: needs.preflight.outputs.has_cert == 'true'
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          DMG_PATH="${{ steps.outputs.outputs.dmg_path }}"
          echo "── spctl (app) ──"
          spctl --assess --type execute --verbose=4 "$APP_PATH" 2>&1 | tee spctl-app.log || true
          echo "── spctl (dmg) ──"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH" 2>&1 | tee spctl-dmg.log || true

      - name: Staple notarization ticket
        if: needs.preflight.outputs.has_cert == 'true' && env.RUN_NOTARIZATION == 'true'
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          DMG_PATH="${{ steps.outputs.outputs.dmg_path }}"
          echo "── Stapling .app (electron-builder's afterSign hook should have already stapled it — this re-validates) ──"
          xcrun stapler validate "$APP_PATH" 2>&1 | tee staple-app.log || echo "::warning::App staple validation failed — see docs/macos-notarization.md troubleshooting"
          echo "── Stapling .dmg (not automatically stapled by electron-builder — done explicitly here) ──"
          xcrun stapler staple "$DMG_PATH" 2>&1 | tee staple-dmg-attempt.log || echo "::warning::DMG staple failed — see docs/macos-notarization.md troubleshooting"
          xcrun stapler validate "$DMG_PATH" 2>&1 | tee staple-dmg.log || echo "::warning::DMG staple validation failed"

      - name: Architecture verification
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          MAIN_BIN="$APP_PATH/Contents/MacOS/Unestra"
          echo "── Main executable architecture ──"
          file "$MAIN_BIN" || true
          lipo -info "$MAIN_BIN" 2>&1 || true
          echo "── better-sqlite3 native binary architecture ──"
          find "$APP_PATH" -name "better_sqlite3.node" -exec file {} \; -exec lipo -info {} \; 2>&1 || echo "better_sqlite3.node not found at expected path — see nested-signing.log"

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip 2>/dev/null | tee checksums-sha256.txt || true

      - name: Artifact content and secret scan
        run: |
          APP_PATH="${{ steps.outputs.outputs.app_path }}"
          echo "── Scanning packaged app for anything that shouldn't ship ──" | tee artifact-scan.log
          find "$APP_PATH" -iname "*.env*" -o -iname "*.pem" -o -iname "*.p12" -o -iname "*.p8" -o -iname "*credential*" -o -iname "*.map" | tee -a artifact-scan.log
          echo "── grepping unpacked resources for obvious secret-shaped strings (best-effort) ──" | tee -a artifact-scan.log
          grep -rlE "sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z]+ PRIVATE KEY-----" "$APP_PATH/Contents/Resources" 2>/dev/null | tee -a artifact-scan.log || echo "No matches" | tee -a artifact-scan.log

      - name: Upload private release-candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unestra-mac-release-candidate-${{ steps.version.outputs.rc_version }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            notarization-result.txt
            codesign-app.log
            nested-signing.log
            spctl-app.log
            spctl-dmg.log
            staple-app.log
            staple-dmg-attempt.log
            staple-dmg.log
            release/checksums-sha256.txt
            artifact-scan.log
          if-no-files-found: warn
          retention-days: 30

      - name: Create draft GitHub Release (opt-in, stays draft)
        if: inputs.create_draft_release_candidate == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rc-${{ steps.version.outputs.rc_version }}"
          gh release create "$TAG" \
            --title "Unestra ${{ steps.version.outputs.rc_version }} (release candidate — not for distribution)" \
            --notes "Private, draft release candidate produced by the macOS signing/notarization validation workflow. Not publicly visible until manually published." \
            --draft \
            release/*.dmg release/*.zip release/checksums-sha256.txt || true

      - name: Clean up temporary keychain (always runs, even on failure)
        if: always() && needs.preflight.outputs.has_cert == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer_id.p12" || true
