name: Report Export Scheduler
# Note: 2026-08-29 — schedule trigger did not fire for ~3h after this
# workflow was first enabled (manual workflow_dispatch worked correctly
# throughout). Matches a known GitHub-side scheduled-workflow registration
# issue reported by other users; GitHub staff guidance is that any commit
# to the default branch resyncs affected scheduled workflows. This comment
# is that resync commit.

# Pings the report-export queue worker (POST /api/cron/reports) on a fixed
# cadence. This workflow does NOT check out the repository, install
# dependencies, or touch the database directly — it makes exactly one HTTPS
# request to the already-deployed production endpoint, which does all real
# work server-side under its own atomic-claim concurrency guard. See
# civicflow-portal/docs/report-export-scheduler.md.
#
# Reporting itself stays disabled for every organization except the Pine
# Grove pilot (server-side flags), so a normal run of this workflow is
# expected to claim and process zero jobs.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

# One fixed group so a delayed scheduled run can never overlap another run
# of this same workflow (manual or scheduled). cancel-in-progress: false —
# a queued run waits for the prior one to finish rather than cancelling it,
# since the HTTP call itself is cheap and idempotent-safe to simply wait for.
# This is defense in depth only: the database's atomic claim
# (claimReportExportBatch) is the actual, sufficient concurrency guard even
# if two calls somehow ran at once.
concurrency:
  group: report-export-scheduler-production
  cancel-in-progress: false

permissions: {}

jobs:
  ping-report-export-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the report-export cron endpoint
        env:
          REPORT_EXPORT_CRON_SECRET: ${{ secrets.REPORT_EXPORT_CRON_SECRET }}
        run: |
          set -euo pipefail

          status=$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /tmp/response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${REPORT_EXPORT_CRON_SECRET}" \
            https://app.getunestra.com/api/cron/reports)

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) http_status=${status}"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) result=FAILED (non-2xx)"
            exit 1
          fi

          # Surface only the specific sanitized integer fields the endpoint
          # is known to return (never the raw body — see route.ts, which
          # only ever emits { ok, processed, cleanupChecked, cleanupDeleted,
          # artifactCleanupChecked, artifactCleanupCleaned }, no object
          # keys/org data/report contents).
          processed=$(jq -r '.processed // "n/a"' /tmp/response.json)
          cleanup_checked=$(jq -r '.cleanupChecked // "n/a"' /tmp/response.json)
          cleanup_deleted=$(jq -r '.cleanupDeleted // "n/a"' /tmp/response.json)
          artifact_checked=$(jq -r '.artifactCleanupChecked // "n/a"' /tmp/response.json)
          artifact_cleaned=$(jq -r '.artifactCleanupCleaned // "n/a"' /tmp/response.json)

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) result=SUCCESS processed=${processed} cleanupChecked=${cleanup_checked} cleanupDeleted=${cleanup_deleted} artifactCleanupChecked=${artifact_checked} artifactCleanupCleaned=${artifact_cleaned}"

          rm -f /tmp/response.json
