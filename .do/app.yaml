name: civicflow-portal
region: nyc
# Domain migration: app.getunestra.com is the new canonical domain;
# app.civicflowapp.com stays as a legacy alias that 308-redirects to it once
# LEGACY_APP_HOSTS is set (see the web service envs below). Keep the legacy
# domain in place until the new one is verified live in production.
domains:
- domain: app.getunestra.com
  type: PRIMARY
- domain: app.civicflowapp.com
  type: ALIAS
services:
- name: web
  github:
    repo: abramph/CivicFlow-platform
    branch: main
    deploy_on_push: true
  source_dir: civicflow-portal
  build_command: npm install --include=dev && ./node_modules/.bin/prisma generate && npm run build
  run_command: npm run db:deploy && npm start
  http_port: 3000
  instance_size_slug: apps-s-1vcpu-1gb
  instance_count: 1
  routes:
  - path: /
  health_check:
    http_path: /api/health
    initial_delay_seconds: 30
    period_seconds: 30
    timeout_seconds: 10
    failure_threshold: 3
  envs:
  - key: NODE_ENV
    value: "production"
  # Canonical public URL. DO NOT set this to the new domain until
  # app.getunestra.com resolves with a valid certificate in production —
  # flipping it early breaks NextAuth callbacks/cookies on the live domain.
  - key: NEXTAUTH_URL
    value: "https://app.getunestra.com"
  # Legacy hosts that 308-redirect to the canonical host. Set this in the SAME
  # cutover step that flips NEXTAUTH_URL above; leave unset until then.
  - key: LEGACY_APP_HOSTS
    value: "app.civicflowapp.com"
  - key: NEXTAUTH_SECRET
    type: SECRET
    value: "REPLACE_ME"
  - key: DATABASE_URL
    type: SECRET
    value: "REPLACE_ME"
  # Stripe (platform SaaS billing) — all values must come from the
  # APH Technologies, LLC Stripe account. See
  # docs/APH_TECHNOLOGIES_STRIPE_SETUP.md for how to retrieve each value.
  - key: STRIPE_SECRET_KEY
    type: SECRET
    value: "REPLACE_ME"
  - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: "REPLACE_ME"
  - key: STRIPE_WEBHOOK_SECRET
    type: SECRET
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ESSENTIAL_MONTHLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ESSENTIAL_YEARLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ELITE_MONTHLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ELITE_YEARLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ESSENTIAL_SEAT_MONTHLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ESSENTIAL_SEAT_YEARLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ELITE_SEAT_MONTHLY
    value: "REPLACE_ME"
  - key: STRIPE_PRICE_ELITE_SEAT_YEARLY
    value: "REPLACE_ME"
  - key: DO_SPACES_ENDPOINT
    value: "https://nyc3.digitaloceanspaces.com"
  - key: DO_SPACES_REGION
    value: "nyc3"
  - key: DO_SPACES_BUCKET
    type: SECRET
    value: "REPLACE_ME"
  - key: DO_SPACES_ACCESS_KEY_ID
    type: SECRET
    value: "REPLACE_ME"
  - key: DO_SPACES_SECRET_ACCESS_KEY
    type: SECRET
    value: "REPLACE_ME"
  - key: SMTP_HOST
    type: SECRET
    value: "REPLACE_ME"
  - key: SMTP_PORT
    value: "587"
  - key: SMTP_USER
    type: SECRET
    value: "REPLACE_ME"
  - key: SMTP_PASS
    type: SECRET
    value: "REPLACE_ME"
  - key: FROM_EMAIL
    value: "Unestra <noreply@civicflowapp.com>"
  - key: ENABLE_EMAIL_SEND
    value: "0"
  - key: CRON_SECRET
    type: SECRET
    value: "REPLACE_ME"
